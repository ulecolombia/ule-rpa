version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ule-rpa-postgres
    environment:
      POSTGRES_USER: ule
      POSTGRES_PASSWORD: ule_password
      POSTGRES_DB: ule_rpa
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ule"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ule-rpa-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Descomentar para producción
